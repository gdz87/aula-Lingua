<meta name="claude:viewport-fit-sides" content="cover">
<title>Aula Lingua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: shell de app móvil — header fijo arriba, barra de pestañas fija abajo, contenido con scroll en medio. Tarjetas de aire amplio. */
:root{
  --bg:#FBF8F3; --surface:#FFFFFF; --surface-2:#F4EFE7;
  --ink:#1B2A38; --muted:#5E6E7C; --faint:#8A97A3;
  --line:#E7E0D4; --line-strong:#D8CFBF;
  --primary:#1D4E6B; --primary-700:#143A50; --primary-soft:#E4EDF2;
  --accent:#E08A2B; --accent-soft:#FBEBD2;
  --good:#2F7A54; --good-soft:#E1F0E7;
  --warn:#B4740C; --warn-soft:#FBEED3;
  --live:#D5443F; --live-soft:#FBE3E2;
  --lang-en:#2563EB; --lang-fr:#7C3AED; --lang-pt:#0E9F6E; --lang-it:#DB5B3B;
  --focus:#0B6E4F;
  --shadow:0 1px 2px rgba(27,42,56,.05), 0 6px 20px rgba(27,42,56,.06);
  --shadow-lg:0 10px 40px rgba(27,42,56,.14);
  --r:16px; --r-sm:11px; --r-lg:22px;
  --s1:.5rem; --s2:1rem; --s3:1.5rem; --s4:2rem; --s5:3rem;
  --maxw:860px;
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#17222E; --surface-2:#1E2B39;
  --ink:#E8EEF3; --muted:#9DB0BF; --faint:#72838F;
  --line:#293847; --line-strong:#35475A;
  --primary:#55A6D6; --primary-700:#78BEE6; --primary-soft:#153143;
  --accent:#E5A24E; --accent-soft:#3A2C16;
  --good:#58BE89; --good-soft:#163026;
  --warn:#E0A94A; --warn-soft:#352813;
  --live:#F07772; --live-soft:#36201F;
  --lang-en:#5B8CF5; --lang-fr:#A684F2; --lang-pt:#45C491; --lang-it:#EE8266;
  --focus:#49C79A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 12px 44px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#17222E; --surface-2:#1E2B39;
  --ink:#E8EEF3; --muted:#9DB0BF; --faint:#72838F;
  --line:#293847; --line-strong:#35475A;
  --primary:#55A6D6; --primary-700:#78BEE6; --primary-soft:#153143;
  --accent:#E5A24E; --accent-soft:#3A2C16;
  --good:#58BE89; --good-soft:#163026;
  --warn:#E0A94A; --warn-soft:#352813;
  --live:#F07772; --live-soft:#36201F;
  --lang-en:#5B8CF5; --lang-fr:#A684F2; --lang-pt:#45C491; --lang-it:#EE8266;
  --focus:#49C79A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 12px 44px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:15.5px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--primary-700)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.18;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--primary);text-decoration:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
input,select,textarea{font-family:inherit;font-size:16px}
.tnum{font-variant-numeric:tabular-nums}

/* App frame */
#app{display:flex;flex-direction:column;min-height:100%}

/* Header */
.hdr{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  background:var(--primary-700);color:#fff;
  padding-block:.7rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:var(--s2);
  box-shadow:0 2px 14px rgba(0,0,0,.18);
}
.hdr .brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.hdr .logo{width:34px;height:34px;flex:none;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#2a1a05;font-family:var(--display);font-weight:700;font-size:18px}
.hdr .bname{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.hdr .bsub{font-size:11px;opacity:.72;margin-top:-3px;letter-spacing:.02em}
.hdr .spacer{flex:1}
.icbtn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12)}
.icbtn:hover{background:rgba(255,255,255,.22)}
.icbtn svg{width:20px;height:20px}

/* Role pill */
.rolepill{
  display:inline-flex;align-items:center;gap:.4rem;height:40px;padding:0 .55rem 0 .8rem;border-radius:11px;
  background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:12.5px;white-space:nowrap;
}
.rolepill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.rolepill.is-admin .dot{background:#9BE1BE}
.rolepill svg{width:15px;height:15px;opacity:.85}

/* Content */
main{flex:1;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{
  max-width:var(--maxw);margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:var(--s3);
}
.view-title{font-size:1.5rem;margin-bottom:.15rem}
.view-sub{color:var(--muted);font-size:13.5px;margin-bottom:var(--s3)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:.6rem}
.section{margin-bottom:var(--s4)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s2)}
.section-head h2{font-size:1.12rem}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:var(--s3)}
.grid{display:grid;gap:var(--s2)}
.grid.c2{grid-template-columns:1fr 1fr}
@media(min-width:620px){.grid.auto{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}

/* Stat tiles */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.1rem 1rem;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary)}
.stat.a::before{background:var(--accent)} .stat.g::before{background:var(--good)} .stat.l::before{background:var(--live)}
.stat .n{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1;letter-spacing:-.02em}
.stat .k{font-size:12px;color:var(--muted);margin-top:.35rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* Hero (continuar) */
.hero{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-700) 100%);color:#fff;border-radius:var(--r-lg);padding:1.4rem;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .lbl{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.hero h2{font-size:1.3rem;margin:.4rem 0 .2rem;color:#fff}
.hero .meta{font-size:13px;opacity:.85}
.hero .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.22);margin:1rem 0 .8rem;overflow:hidden}
.hero .bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:0 1.15rem;border-radius:12px;font-weight:600;font-size:14.5px;background:var(--primary);color:#fff;transition:transform .05s, filter .15s;border:1px solid transparent}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px}
.btn.accent{background:var(--accent);color:#271703}
.btn.live{background:var(--live);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 .9rem;font-size:13.5px}
.btn.on-hero{background:#fff;color:var(--primary-700)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:.35rem;height:24px;padding:0 .6rem;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--surface-2);color:var(--muted)}
.chip.lv{background:var(--primary-soft);color:var(--primary-700)}
.chip.en{background:color-mix(in srgb,var(--lang-en) 16%,transparent);color:var(--lang-en)}
.chip.fr{background:color-mix(in srgb,var(--lang-fr) 16%,transparent);color:var(--lang-fr)}
.chip.pt{background:color-mix(in srgb,var(--lang-pt) 16%,transparent);color:var(--lang-pt)}
.chip.it{background:color-mix(in srgb,var(--lang-it) 16%,transparent);color:var(--lang-it)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.live{background:var(--live-soft);color:var(--live)}
.chip .pulse{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.chip .pulse{animation:none}}

/* Course card */
.course{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.course .top{height:64px;position:relative;display:flex;align-items:flex-end;padding:.7rem .9rem}
.course .top .flag{position:absolute;right:.7rem;top:.7rem;font-size:20px}
.course .top h3{color:#fff;font-size:1.02rem;z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.course .body{padding:.9rem;display:flex;flex-direction:column;gap:.7rem;flex:1}
.course .meta{display:flex;gap:.4rem;flex-wrap:wrap}
.course .prog{margin-top:auto}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--good)}
.bar.accent>i{background:var(--accent)}
.prog .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:.35rem;font-weight:600}

/* Lesson rows */
.lesson{display:flex;align-items:center;gap:.85rem;padding:.9rem;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--shadow)}
.lesson+.lesson{margin-top:.6rem}
.lesson .ic{width:42px;height:42px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-700)}
.lesson .ic svg{width:20px;height:20px}
.lesson.done .ic{background:var(--good-soft);color:var(--good)}
.lesson .grow{flex:1;min-width:0}
.lesson .t{font-weight:600;font-size:14.5px;line-height:1.3}
.lesson .s{font-size:12px;color:var(--muted);margin-top:.15rem;display:flex;gap:.5rem;flex-wrap:wrap}
.lesson .go{color:var(--faint)}
.lesson .go svg{width:20px;height:20px}

/* List rows (books, students, classes) */
.row{display:flex;align-items:center;gap:.85rem;padding:.9rem;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--shadow)}
.row+.row{margin-top:.6rem}
.row .thumb{width:44px;height:56px;flex:none;border-radius:8px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:11px;text-align:center;line-height:1.1;padding:3px}
.row .av{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--primary-soft);color:var(--primary-700)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14.5px}
.row .s{font-size:12px;color:var(--muted);margin-top:.1rem}
.row .actions{display:flex;gap:.4rem;flex:none}

/* Live class banner */
.livebox{border:1.5px solid var(--live);background:var(--live-soft);border-radius:var(--r);padding:var(--s3);display:flex;flex-direction:column;gap:.8rem}
.livebox .hd{display:flex;align-items:center;gap:.6rem}
.livebox h3{font-size:1.1rem}

/* Bottom nav */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:55;
  background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -4px 20px rgba(27,42,56,.08);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  display:flex;
}
.tabbar .tab{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;color:var(--faint);font-size:10.5px;font-weight:600;letter-spacing:.01em;position:relative}
.tabbar .tab svg{width:23px;height:23px}
.tabbar .tab[aria-current="page"]{color:var(--primary)}
.tabbar .tab[aria-current="page"]::before{content:"";position:absolute;top:0;width:30px;height:3px;border-radius:0 0 4px 4px;background:var(--primary)}
:root[data-theme="dark"] .tabbar .tab[aria-current="page"],
@media (prefers-color-scheme:dark){.tabbar .tab[aria-current="page"]{color:var(--primary-700)}}

/* Modal */
.ov{position:fixed;inset:0;z-index:100;background:rgba(15,24,33,.55);display:flex;align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(2px)}
@media(min-width:620px){.ov{align-items:center;padding:var(--s3)}}
.sheet{
  width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);
  border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-lg);
  padding:var(--s3);
  padding-bottom:calc(var(--s3) + env(safe-area-inset-bottom,0px));
  padding-left:max(var(--s3),env(safe-area-inset-left,0px));
  padding-right:max(var(--s3),env(safe-area-inset-right,0px));
}
@media(min-width:620px){.sheet{border-radius:var(--r-lg)}}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line-strong);margin:0 auto .9rem}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s2)}
.sheet-head h2{font-size:1.25rem}
.closex{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}

/* Forms */
.field{margin-bottom:var(--s2)}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:.4rem;letter-spacing:.02em}
.field input,.field select,.field textarea{
  width:100%;min-height:46px;padding:.65rem .85rem;border:1px solid var(--line-strong);border-radius:11px;
  background:var(--surface);color:var(--ink);
}
.field textarea{min-height:90px;resize:vertical;line-height:1.5}
.field .hint{font-size:11.5px;color:var(--faint);margin-top:.35rem}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}

/* Reader */
.reader .page{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);min-height:300px;box-shadow:var(--shadow)}
.reader .page h3{font-size:1.15rem;margin-bottom:.8rem;color:var(--primary-700)}
.reader .page p{margin-bottom:.9rem;color:var(--ink)}
.reader .page .ex{background:var(--primary-soft);border-left:3px solid var(--primary);padding:.8rem 1rem;border-radius:0 10px 10px 0;font-style:italic;color:var(--primary-700);margin-bottom:.9rem}
.reader .nav{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-top:var(--s2)}
.reader .pageno{font-size:13px;color:var(--muted);font-weight:600}

/* Lesson detail */
.ldetail .videobox{aspect-ratio:16/9;max-width:100%;border-radius:var(--r);background:linear-gradient(135deg,#17303f,#0d1d28);display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;margin-bottom:var(--s2)}
.ldetail .videobox .play{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;backdrop-filter:blur(3px)}
.ldetail .videobox .play svg{width:30px;height:30px}
.ldetail .videobox .tag{position:absolute;left:12px;bottom:12px;font-size:11px;background:rgba(0,0,0,.4);padding:.25rem .55rem;border-radius:7px}
.ldetail .obj{background:var(--accent-soft);border-radius:12px;padding:1rem;margin-bottom:var(--s2);font-size:13.5px}
.ldetail .obj b{color:var(--warn)}
.ldetail .content p{margin-bottom:.9rem}
.ldetail .mats .row .thumb{border-radius:8px}

/* Login / role screen */
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;
  padding:var(--s4) max(20px,env(safe-area-inset-left)) calc(var(--s4) + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-right));
  max-width:460px;margin-inline:auto}
.login .mark{width:66px;height:66px;border-radius:20px;background:var(--accent);display:grid;place-items:center;color:#2a1a05;font-family:var(--display);font-weight:700;font-size:34px;margin-bottom:var(--s3);box-shadow:var(--shadow-lg)}
.login h1{font-size:2rem;margin-bottom:.3rem}
.login .lead{color:var(--muted);margin-bottom:var(--s4)}
.rolecard{display:flex;align-items:center;gap:var(--s2);text-align:left;width:100%;padding:1.2rem;border:1.5px solid var(--line-strong);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);margin-bottom:var(--s2);transition:border-color .15s,transform .05s}
.rolecard:hover{border-color:var(--primary)} .rolecard:active{transform:translateY(1px)}
.rolecard .ic{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;color:#fff}
.rolecard .ic svg{width:26px;height:26px}
.rolecard .ic.stu{background:var(--primary)} .rolecard .ic.adm{background:var(--accent);color:#2a1a05}
.rolecard .t{font-family:var(--display);font-weight:700;font-size:1.1rem}
.rolecard .d{font-size:12.5px;color:var(--muted);margin-top:.15rem}
.rolecard .arr{margin-left:auto;color:var(--faint)}

/* Misc */
.notebox{background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:12px;padding:.85rem 1rem;font-size:12.5px;color:var(--muted);display:flex;gap:.6rem}
.notebox svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--faint)}
.empty{text-align:center;color:var(--muted);padding:var(--s4) var(--s2)}
.empty svg{width:40px;height:40px;color:var(--line-strong);margin-bottom:.6rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:200;background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.subtitle-line{color:var(--muted);font-size:13px}
.divider{height:1px;background:var(--line);margin:var(--s3) 0}
.pfield{display:flex;justify-content:space-between;align-items:center;padding:.9rem 0;border-bottom:1px solid var(--line)}
.pfield:last-child{border-bottom:none}
.pfield .k{color:var(--muted);font-size:13px}
.pfield .v{font-weight:600}
.gradepill{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.05rem;background:var(--surface-2);color:var(--muted)}
.gradepill.good{background:var(--good-soft);color:var(--good)}
.gradepill.warn{background:var(--warn-soft);color:var(--warn)}
.gradepill.live{background:var(--live-soft);color:var(--live)}
.quiz .q{margin-bottom:var(--s3)}
.quiz .qt{font-weight:700;margin-bottom:.6rem}

const DB_KEY='aula_lingua_v8';
let DB, UI={role:'student', view:'inicio', modal:null};
let reviewState=null;
const ME='s-tu';

function load(){
  try{const raw=localStorage.getItem(DB_KEY); if(raw){const d=JSON.parse(raw); if(d&&d.version===8){DB=d; return;}}}catch(e){}
  DB=seed(); save();
}
function save(){ try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){} }

/* ---------- Helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const course=id=>DB.courses.find(c=>c.id===id);
const me=()=>DB.students.find(s=>s.id===ME);
const langClass=lang=>LANGS[lang]||'en';
function courseProgress(c,studentId=ME){
  const st=DB.students.find(s=>s.id===studentId); if(!st||!c.lessons.length) return 0;
  const done=c.lessons.filter(l=>st.completed.includes(c.id+'|'+l.id)).length;
  return Math.round(done/c.lessons.length*100);
}
function isDone(cid,lid,studentId=ME){const st=DB.students.find(s=>s.id===studentId);return st&&st.completed.includes(cid+'|'+lid);}
function initials(n){return n.replace(/\(.*\)/,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function jitsi(room){return 'https://meet.jit.si/'+encodeURIComponent('AulaLingua-'+room);}
function studentGrades(sid){return (DB.grades||[]).filter(g=>g.studentId===sid);}
function courseAvg(sid,cid){const gs=studentGrades(sid).filter(g=>g.courseId===cid);if(!gs.length)return null;return gs.reduce((a,g)=>a+g.score,0)/gs.length;}
function overallAvg(sid){const gs=studentGrades(sid);if(!gs.length)return null;return gs.reduce((a,g)=>a+g.score,0)/gs.length;}
function gradeCls(s){return s>=4?'good':s>=3?'warn':'live';}
function gradeFmt(s){return s==null?'—':(Math.round(s*10)/10).toFixed(1);}
function findGrade(sid,cid,title){return (DB.grades||[]).find(g=>g.studentId===sid&&g.courseId===cid&&g.title===title);}
function upsertGrade(sid,cid,title,score){
  const ex=findGrade(sid,cid,title), date=new Date().toLocaleDateString('es-CO',{day:'numeric',month:'short'});
  if(ex){ex.score=score;ex.date=date;} else DB.grades.push({id:'g'+Date.now().toString(36),studentId:sid,courseId:cid,title,score,date});
  save();
}
function courseAvgAll(cid){const gs=(DB.grades||[]).filter(g=>g.courseId===cid);if(!gs.length)return null;return gs.reduce((a,g)=>a+g.score,0)/gs.length;}
function xpOf(sid){const st=DB.students.find(s=>s.id===sid);return st?st.completed.length*50+studentGrades(sid).length*20:0;}
function teacherName(id){const t=(DB.teachers||[]).find(x=>x.id===id);return t?t.name:'Docente';}
function myGlossary(){return (DB.glossary||[]).filter(g=>g.studentId===ME);}
function attendList(clid){return (DB.attendance&&DB.attendance[clid])||[];}
function notifications(){
  const st=me(), list=[];
  const live=DB.classes.find(c=>c.live);
  if(live) list.push({ic:'🔴',t:'Clase en vivo ahora: '+live.title,s:live.time});
  const pend=DB.assignments.filter(t=>t.status==='pendiente'&&st.enrolled.includes(t.courseId));
  if(pend.length) list.push({ic:'📝',t:'Tienes '+pend.length+' tarea(s) por entregar',s:'Próxima: '+pend[0].due});
  const next=DB.classes.find(c=>!c.live);
  if(next) list.push({ic:'📅',t:'Próxima clase: '+next.title,s:next.day+' · '+next.time});
  const due=myGlossary().filter(w=>w.box<3).length;
  if(due) list.push({ic:'🗂️',t:due+' palabra(s) listas para repasar',s:'Glosario'});
  if((DB.forum||[]).length) list.push({ic:'💬',t:'Nuevo reto en el foro',s:DB.forum[0].title});
  return list;
}

function viewContent(){
  const v=UI.view;

  if(v==='inicio') return stuInicio();

  if(v==='biblioteca') return biblioteca(false);

  // admin

function modalCourse(cid){
  const c=course(cid); if(!c) return;

  openModal(`
    ${sheetHead(c.name, c.lang+' · Nivel '+c.level)}
    <div class="prog" style="margin-bottom:var(--s3)">
      <div class="lbl"><span>Tu progreso</span><span class="tnum">${pr}%</span></div>

function lessonRow(c,l,i){
  const done=isDone(c.id,l.id);
  const typeIc={video:I.play,lectura:I.read,quiz:I.quiz}[l.type]||I.play;
  return `<button class="lesson ${done?'done':''}" data-act="openLesson" data-course="${c.id}" data-lesson="${l.id}" style="width:100%;text-align:left">
    <div class="ic">${done?I.check:typeIc}</div>
    <div class="grow"><div class="t">${i+1}. ${esc(l.title)}</div>
    <div class="s"><span>${esc(l.type)}</span><span>· ${l.dur} min</span>${done?'<span style="color:var(--good)">· completada</span>':''}</div></div>
    <span class="go">${I.chevR}</span>
  </button>`;
}

  openModal(`
    ${sheetHead(l.title, c.name+' · '+c.level)}
    <div class="ldetail">
      ${l.type==='quiz'

/* --- Quiz interactivo (autocalificado) --- */
function modalQuiz(cid,lid,opts){
  opts=opts||{};
  const c=course(cid); if(!c)return; const l=c.lessons.find(x=>x.id===lid); if(!l)return;
  const qs=l.questions||[];
  const existing=findGrade(ME,cid,l.title);

  if(opts.justSubmitted){
    const {score,correct,total}=opts.justSubmitted, passed=score>=3;
    openModal(`${sheetHead(l.title,c.name+' · '+c.level)}
      <div class="quizresult">
        <div class="gradepill ${gradeCls(score)}" style="width:104px;height:104px;font-size:2.4rem;margin:0 auto var(--s2)">${gradeFmt(score)}</div>
        <div class="big" style="font-size:1.5rem">${passed?'¡Aprobado! 🎉':'Sigue practicando'}</div>
        <p class="subtitle-line" style="margin-top:.5rem">${correct} de ${total} correctas · nota ${gradeFmt(score)} / 5.0</p>
        <p class="subtitle-line">${passed?'Lección completada y nota registrada en Calificaciones.':'Nota registrada. Puedes reintentar cuando quieras.'}</p>
      </div>
      <button class="btn block" data-act="retakeQuiz" data-course="${cid}" data-lesson="${lid}">${I.quiz} Reintentar</button>
      <button class="btn ghost block" style="margin-top:.6rem" data-act="closeModal">Cerrar</button>`);
    return;
  }
  if(existing && !opts.retake){
    const passed=existing.score>=3;
    openModal(`${sheetHead(l.title,c.name+' · '+c.level)}
      <div class="quizresult">
        <div class="gradepill ${gradeCls(existing.score)}" style="width:92px;height:92px;font-size:2rem;margin:0 auto var(--s2)">${gradeFmt(existing.score)}</div>
        <div class="big" style="font-size:1.35rem">${passed?'Aprobado ✓':'No aprobado'}</div>
        <p class="subtitle-line" style="margin-top:.4rem">Ya resolviste este quiz. Tu nota está en Calificaciones.</p>
      </div>
      <button class="btn block" data-act="retakeQuiz" data-course="${cid}" data-lesson="${lid}">${I.quiz} Reintentar quiz</button>
      <button class="btn ghost block" style="margin-top:.6rem" data-act="closeModal">Cerrar</button>`);
    return;
  }
  openModal(`${sheetHead(l.title,c.name+' · '+c.level)}
    <div class="obj" style="background:var(--accent-soft);border-radius:12px;padding:1rem;margin-bottom:var(--s3);font-size:13.5px"><b style="color:var(--warn)">Objetivo:</b> ${esc(l.obj)} · ${qs.length} preguntas · aprobado con 3.0</div>
    <form id="quizfrm" class="quiz">
      ${qs.map((q,qi)=>`<div class="q"><div class="qt">${qi+1}. ${esc(q.q)}</div>
        ${q.options.map((o,oi)=>`<label class="opt"><input type="radio" name="q${qi}" value="${oi}"><span>${esc(o)}</span></label>`).join('')}
      </div>`).join('')}
      <button class="btn accent block" type="submit" data-act="submitQuiz" data-course="${cid}" data-lesson="${lid}">${I.check} Enviar respuestas</button>
    </form>`);
}

/* ======================================================================
   EVENTOS
   ====================================================================== */
function isDark(){
  const a=document.documentElement.getAttribute('data-theme');
  if(a) return a==='dark';
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
}
function toggleTheme(){
  const next=isDark()?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('aula_theme',next);}catch(e){}
  render();
}

document.addEventListener('click',e=>{
  const bg=e.target.closest('[data-act="closeIfBg"]');
  if(bg && e.target===bg){closeModal();return;}
  const el=e.target.closest('[data-act]'); if(!el)return;
  const act=el.dataset.act;
  const cid=el.dataset.course, lid=el.dataset.lesson, bid=el.dataset.book, sid=el.dataset.sid;

  switch(act){
    case 'theme': toggleTheme(); break;
    case 'switchRole':
      UI.role = UI.role==='admin'?'student':'admin';
      UI.view = UI.role==='admin'?'panel':'inicio';
      closeModal(); render();
      toast(UI.role==='admin'?'Vista Docente':'Vista Alumno');
      break;
    case 'logout': showLogin(); break;
    case 'nav': UI.view=el.dataset.view; closeModal(); render(); window.scrollTo(0,0); break;
    case 'openCourse': modalCourse(cid); break;
    case 'openLesson': {
      const c=course(cid), l=c&&c.lessons.find(x=>x.id===lid);
      if(l&&l.type==='quiz'&&l.questions&&l.questions.length) openStudyQuiz(cid,lid);
      else modalLesson(cid,lid);
      break;
    }
    case 'chooseOpt': if(study&&!study.answered){study.chosen=parseInt(el.dataset.oi);renderStudy();} break;
    case 'checkStudy': if(study&&study.chosen!=null&&!study.answered){study.answered=true;const q=study.qs[study.i];const ok=study.chosen===q.correct;if(ok)study.correct++;ding(ok);renderStudy();} break;
    case 'nextStudy': if(study){if(study.i<study.qs.length-1){study.i++;study.chosen=null;study.answered=false;renderStudy();}else finishStudy();} break;
    case 'retakeStudy': if(study){study.i=0;study.chosen=null;study.answered=false;study.correct=0;study.done=false;renderStudy();} break;
    case 'exitStudy': study=null; renderStudy(); render(); break;
    case 'toggleSound': { try{localStorage.setItem('aula_sound',soundOn()?'0':'1');}catch(e){} renderStudy(); break; }
    case 'submitQuiz': {
      e.preventDefault();
      const c=course(cid), l=c&&c.lessons.find(x=>x.id===lid); if(!l)break;
      const qs=l.questions||[]; let correct=0;
      qs.forEach((q,qi)=>{const sel=document.querySelector('input[name="q'+qi+'"]:checked'); if(sel&&parseInt(sel.value)===q.correct)correct++;});
      const score=qs.length?Math.round(correct/qs.length*5*10)/10:0;
      upsertGrade(ME,cid,l.title,score);
      if(score>=3){const st=me(),key=cid+'|'+lid; if(!st.completed.includes(key)){st.completed.push(key);save();}}
      render();
      modalQuiz(cid,lid,{justSubmitted:{score,correct,total:qs.length}});
      toast(score>=3?'¡Quiz aprobado! Nota '+gradeFmt(score):'Quiz enviado · nota '+gradeFmt(score));
      break;
    }
    case 'retakeQuiz': modalQuiz(cid,lid,{retake:true}); break;
    case 'openTask': modalTask(el.dataset.task); break;
    case 'reopenTask': { const t=DB.assignments.find(x=>x.id===el.dataset.task); if(t){t.status='pendiente';save();modalTask(t.id);render();} break; }
    case 'submitTask': {
      e.preventDefault();
      const t=DB.assignments.find(x=>x.id===el.dataset.task); if(!t)break;
      const text=($('#f-sub').value||'').trim();
      const f=$('#f-file').files[0], audio=$('#f-audio')?$('#f-audio').files[0]:null;
      const finalize=(audioUrl)=>{t.status='entregada';t.submission=text;if(f)t.fileName=f.name;if(audioUrl)t.audioUrl=audioUrl;save();closeModal();render();toast('Tarea entregada ✓');};
      if(audio&&audio.size<=4*1024*1024){const r=new FileReader();r.onload=()=>finalize(r.result);r.onerror=()=>finalize(null);r.readAsDataURL(audio);}
      else finalize(null);
      break;
    }
    case 'toggleLesson': {
      const st=me(), key=cid+'|'+lid, i=st.completed.indexOf(key);
      if(i>=0) st.completed.splice(i,1); else st.completed.push(key);
      save(); modalLesson(cid,lid); render();
      toast(i>=0?'Marcada como pendiente':'¡Lección completada! 🎉');
      break;
    }
    case 'enroll': {
      const st=me(); if(!st.enrolled.includes(cid)){st.enrolled.push(cid);save();}
      render(); toast('Inscrito en el curso ✓'); break;
    }
    case 'readBook': { e.preventDefault(); const pg=el.dataset.page!==undefined?parseInt(el.dataset.page):0; modalReader(bid,pg); break; }
    case 'viewStudent': modalStudent(sid); break;
    case 'manageLessons': modalManageLessons(cid); break;
    case 'closeModal': closeModal(); break;

    /* admin forms */
    case 'addCourse': modalAddCourse(); break;
    case 'addLesson': modalAddLesson(cid); break;
    case 'uploadBook': modalUploadBook(); break;
    case 'createClass': modalCreateClass(); break;
    case 'postAnn': modalPostAnn(); break;
    case 'addGrade': modalAddGrade(sid); break;
    case 'delGrade': {
      const gid=el.dataset.gid, g=DB.grades.find(x=>x.id===gid), sid2=g&&g.studentId;
      DB.grades=DB.grades.filter(x=>x.id!==gid); save();
      if(sid2)modalStudent(sid2); render(); toast('Nota eliminada'); break;
    }

    /* notificaciones y test de nivelación */
    case 'notifs': modalNotifications(); break;
    case 'placement': modalPlacement(); break;
    case 'submitPlacement': {
      e.preventDefault();
      let correct=0; PLACEMENT.forEach((q,qi)=>{const sel=document.querySelector('input[name="p'+qi+'"]:checked');if(sel&&parseInt(sel.value)===q.c)correct++;});
      const level=placementLevel(correct); me().level=level; save();
      modalPlacement({result:{level,correct}}); render(); toast('Nivel asignado: '+level); break;
    }

    /* glosario / flashcards */
    case 'addWord': modalAddWord(); break;
    case 'saveWord': {
      e.preventDefault();
      const w=$('#f-word').value.trim(), m=$('#f-mean').value.trim();
      if(!w||!m){toast('Completa palabra y significado');break;}
      DB.glossary.push({id:'w'+Date.now().toString(36),studentId:ME,word:w,meaning:m,example:$('#f-ex').value.trim(),courseId:$('#f-course').value,box:1});

    case 'saveCourse': {
      e.preventDefault();

      DB.courses.push({id,name,lang,level,room:id,lessons:[]});
      save(); closeModal(); render(); toast('Curso creado ✓'); break;
    }
    case 'saveLesson': {
      e.preventDefault();
      const c=course(cid); if(!c)break;
      const title=$('#f-title').value.trim(); if(!title){toast('Escribe un título');break;}
      c.lessons.push({id:'l'+Date.now().toString(36).slice(-4),title,type:$('#f-type').value,dur:parseInt($('#f-dur').value)||15,obj:$('#f-obj').value.trim()||'—',content:[$('#f-obj').value.trim()||'Contenido por definir.'],ex:'',mats:[]});
      save(); closeModal(); render(); toast('Lección añadida ✓'); break;
    }
    case 'saveBook': {
      e.preventDefault();
      const title=$('#f-title').value.trim(); if(!title){toast('Escribe un título');break;}
      const lang=$('#f-lang').value, level=$('#f-level').value;
      const file=$('#f-file').files[0];
      const finish=(dataUrl,fileName,kind)=>{
        DB.books.push({id:'b'+Date.now().toString(36),title,author:'Docente',lang,level,kind:kind||'PDF',dataUrl,fileName});
        save(); closeModal(); render(); toast('Material subido ✓');
      };
      if(file){
        if(file.size>3.5*1024*1024){ finish(null,file.name,'PDF'); toast('Archivo grande: ficha creada sin adjuntar'); break; }
        const r=new FileReader();
        r.onload=()=>finish(r.result,file.name, file.type.includes('audio')?'Audio':(file.type.includes('image')?'Imagen':'PDF'));
        r.onerror=()=>finish(null,file.name,'PDF');
        r.readAsDataURL(file);
      } else finish(null,null,'Ficha');
      break;
    }
    case 'saveClass': {
      e.preventDefault();

      save(); closeModal(); render(); toast('Anuncio publicado ✓'); break;
    }
  }
});

   MODO ESTUDIO (Zen) · quiz a pantalla completa con feedback inmediato
   ====================================================================== */
let study=null, _ac=null;
function soundOn(){try{return localStorage.getItem('aula_sound')!=='0';}catch(e){return true;}}
function ding(ok){ if(!soundOn())return; try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.connect(g);g.connect(_ac.destination);o.type='sine';o.frequency.setValueAtTime(ok?660:200,_ac.currentTime);if(ok)o.frequency.exponentialRampToValueAtTime(990,_ac.currentTime+.12);g.gain.setValueAtTime(.14,_ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,_ac.currentTime+.3);o.start();o.stop(_ac.currentTime+.32);}catch(e){} }
function confetti(){ if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const colors=['#E08A2B','#1D4E6B','#2F7A54','#D5443F','#7C3AED'];
  const d=document.createElement('div');d.className='confetti';
  for(let i=0;i<70;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=colors[i%colors.length];s.style.animationDuration=(1.8+Math.random()*1.4)+'s';s.style.animationDelay=(Math.random()*.4)+'s';d.appendChild(s);}
  document.body.appendChild(d);setTimeout(()=>d.remove(),3600);
}
function openStudyQuiz(cid,lid){
  const c=course(cid),l=c&&c.lessons.find(x=>x.id===lid); if(!l)return;
  closeModal();
  study={cid,lid,qs:l.questions||[],i:0,chosen:null,answered:false,correct:0,title:l.title,course:c,done:false};
  renderStudy();
}
function renderStudy(){
  const root=$('#study-root'); if(!study){root.innerHTML='';document.body.style.overflow='';return;}
  document.body.style.overflow='hidden';
  const s=study;
  if(s.done){
    const total=s.qs.length, score=total?Math.round(s.correct/total*5*10)/10:0, passed=score>=3;
    root.innerHTML=`<div class="study">
      <div class="sbar"><button class="closex" data-act="exitStudy" aria-label="Salir">${I.x}</button><div class="prog"><i style="width:100%"></i></div><span style="width:40px"></span></div>
      <div class="sbody" style="text-align:center">
        <div style="font-size:3.4rem">${passed?'🎉':'💪'}</div>
        <div class="gradepill ${gradeCls(score)}" style="width:112px;height:112px;font-size:2.6rem;margin:var(--s2) auto">${gradeFmt(score)}</div>
        <div class="prompt" style="font-size:1.4rem">${passed?'¡Lección superada!':'¡Buen intento!'}</div>
        <div class="cue">${s.correct} de ${total} correctas · nota ${gradeFmt(score)}/5.0</div>
        <div style="display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:var(--s2)">
          <span class="chip good">+${total*10} XP</span>${passed?'<span class="chip warn">🔥 Racha mantenida</span>':''}
          ${passed?'<span class="chip lv">Lección completada</span>':''}
        </div>
      </div>
      <div class="sfoot"><div style="display:flex;gap:.6rem">
        <button class="btn ghost grow" data-act="retakeStudy">Reintentar</button>
        <button class="btn accent grow" data-act="exitStudy">Finalizar</button>
      </div></div></div>`;
    return;
  }
  const q=s.qs[s.i], pct=Math.round(s.i/s.qs.length*100);
  root.innerHTML=`<div class="study">
    <div class="sbar">
      <button class="closex" data-act="exitStudy" aria-label="Salir">${I.x}</button>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <button class="icbtn" style="background:var(--surface-2);color:var(--muted)" data-act="toggleSound" aria-label="Sonido">${soundOn()?'🔊':'🔇'}</button>
    </div>
    <div class="sbody">
      <div class="cue">${s.course?FLAGS[s.course.lang]+' '+esc(s.title):''} · ${s.i+1} de ${s.qs.length}</div>
      <div class="prompt">${esc(q.q)}</div>
      <div style="display:flex;flex-direction:column;gap:.7rem;margin-top:var(--s2)">
        ${q.options.map((o,oi)=>{let cls='sopt';if(s.answered){if(oi===q.correct)cls+=' ok';else if(oi===s.chosen)cls+=' no';}else if(oi===s.chosen)cls+=' sel';
          return `<button class="${cls}" data-act="chooseOpt" data-oi="${oi}" ${s.answered?'disabled':''}>${esc(o)}</button>`;}).join('')}
      </div>
    </div>
    <div class="sfoot">
      ${s.answered?`<div class="fb ${s.chosen===q.correct?'ok':'no'}">${s.chosen===q.correct?'¡Correcto! 🎉':'Correcta: '+esc(q.options[q.correct])}</div>`:''}
      <button class="btn accent block" data-act="${s.answered?'nextStudy':'checkStudy'}" ${(!s.answered&&s.chosen==null)?'disabled style="opacity:.5"':''}>
        ${s.answered?(s.i<s.qs.length-1?'Continuar →':'Ver resultado →'):'Comprobar →'}
      </button>
    </div>
  </div>`;
}
function finishStudy(){
  const s=study, total=s.qs.length, score=total?Math.round(s.correct/total*5*10)/10:0;
  upsertGrade(ME,s.cid,s.title,score);
  if(score>=3){const st=me(),key=s.cid+'|'+s.lid; if(!st.completed.includes(key)){st.completed.push(key);save();} confetti();}
  s.done=true; renderStudy(); render();
}

        <div style="font-size:13.5px">${esc(m.text)}</div></div></div>`;}).join('')
        :`<div class="empty" style="padding:var(--s2)">${I.user}<div>Sé el primero en escribir.</div></div>`}
    </div>
    <form id="frm" style="display:flex;gap:.5rem">
      <input id="f-msg" placeholder="Escribe un mensaje…" style="flex:1;min-height:46px;padding:.6rem .8rem;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--ink)">
      <button class="btn" type="submit" data-act="sendChat" data-course="${cid}">Enviar</button>
    </form>`);
}

function modalPlacement(opts){
  opts=opts||{};
  if(opts.result!=null){
    const lvl=opts.result.level;
    openModal(`${sheetHead('Resultado del test','Nivelación automática')}
      <div class="quizresult">
        <div class="chip lv" style="height:auto;padding:.5rem 1.2rem;font-size:1.6rem;font-family:var(--display)">${lvl}</div>
        <div class="big" style="font-size:1.3rem;margin-top:.8rem">Tu nivel sugerido es ${lvl}</div>
        <p class="subtitle-line" style="margin-top:.4rem">${opts.result.correct} de ${PLACEMENT.length} correctas. Tu perfil se actualizó a ${lvl}.</p>
      </div>

      <button class="btn ghost block" style="margin-top:.6rem" data-act="closeModal">Cerrar</button>`);
    return;
  }
  openModal(`${sheetHead('Test de nivelación','Responde para ubicar tu nivel (A1–B2)')}
    <form id="quizfrm" class="quiz">
      ${PLACEMENT.map((q,qi)=>`<div class="q"><div class="qt">${qi+1}. ${esc(q.q)}</div>
        ${q.o.map((o,oi)=>`<label class="opt"><input type="radio" name="p${qi}" value="${oi}"><span>${esc(o)}</span></label>`).join('')}
      </div>`).join('')}
      <button class="btn accent block" type="submit" data-act="submitPlacement">${I.check} Calcular mi nivel</button>
    </form>`);
}

   AULA: reserva 1:1, asistencia, sustitución (modales admin)

function modalAddSlot(){
  openModal(`${sheetHead('Abrir cupo 1 a 1','Disponibilidad para clases individuales')}
    <form id="frm">
      <div class="field"><label for="f-teacher">Docente</label><select id="f-teacher">${DB.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
      <div class="frow"><div class="field"><label for="f-day">Día</label><input id="f-day" placeholder="Ej. Lun 3 nov" required></div>
      <div class="field"><label for="f-time">Hora</label><input id="f-time" value="15:00"></div></div>
      <button class="btn accent block" type="submit" data-act="saveSlot">${I.plus} Abrir cupo</button>
    </form>`);
}
function modalAttendance(clid){
  const cl=DB.classes.find(c=>c.id===clid); if(!cl)return;
  const c=course(cl.courseId);
  const enrolled=DB.students.filter(s=>s.enrolled.includes(cl.courseId));
  const present=attendList(clid);
  openModal(`${sheetHead('Asistencia','"'+cl.title+'" · '+cl.day+' '+cl.time)}
    <div class="notebox" style="margin-bottom:var(--s2)"><span class="chip good">${present.length} presentes</span><span class="chip live">${Math.max(0,enrolled.length-present.length)} ausentes</span></div>
    ${enrolled.length?enrolled.map(s=>{const here=present.includes(s.id);return `<div class="row">
      <div class="av">${initials(s.name)}</div><div class="grow"><div class="t" style="font-size:14px">${esc(s.name)}</div></div>
      <span class="chip ${here?'good':'warn'}">${here?'Presente':'Ausente'}</span></div>`;}).join('')
      :`<div class="empty">${I.users}<div>Sin alumnos inscritos en el curso.</div></div>`}
    ${protoNote('La asistencia se registra cuando el alumno entra a la sala desde la app.')}`);
}
function modalSubstitute(clid){
  const cl=DB.classes.find(c=>c.id===clid); if(!cl)return;
  openModal(`${sheetHead('Cambiar docente','La sala y el enlace se conservan')}
    <form id="frm">
      <div class="field"><label for="f-teacher">Nuevo docente</label><select id="f-teacher">${DB.teachers.map(t=>`<option value="${t.id}" ${t.id===cl.teacherId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
      <div class="notebox" style="margin-bottom:var(--s2)">${I.info}<div>Sala: <b>${esc(cl.room)}</b> (sin cambios)</div></div>
      <button class="btn accent block" type="submit" data-act="saveSubstitute" data-class="${clid}">${I.swap} Asignar docente</button>
    </form>`);
}

  const c=course(t.courseId);
  openModal(`${sheetHead('Revisar entrega',t.title)}
    <div class="card pad" style="margin-bottom:var(--s2)">
      <div class="eyebrow">Entrega del alumno</div>
      ${t.submission?`<p style="font-size:14px">${esc(t.submission)}</p>`:`<p class="subtitle-line">Sin texto.</p>`}
      ${t.fileName?`<div class="s" style="margin-top:.4rem;color:var(--muted)">📎 ${esc(t.fileName)}</div>`:''}
      ${t.audioUrl?`<audio controls src="${t.audioUrl}" style="width:100%;margin-top:.6rem"></audio>`:''}
      ${t.status!=='entregada'?`<span class="chip warn">Aún no entregada</span>`:''}
    </div>
    <form id="frm">
      <div class="field"><label>Comentarios rápidos</label>
        <div style="display:flex;flex-wrap:wrap;gap:.4rem">${DB.feedbackTemplates.map(f=>`<button type="button" class="chip" style="cursor:pointer;height:auto;padding:.4rem .7rem" data-act="insertFb" data-fb="${esc(f).replace(/"/g,'&quot;')}">${esc(f)}</button>`).join('')}</div></div>
      <div class="field"><label for="f-fb">Retroalimentación escrita</label><textarea id="f-fb" placeholder="Escribe o inserta un comentario…">${esc(t.feedback||'')}</textarea></div>
      <div class="field"><label for="f-fbaudio">Nota de voz de corrección (audio)</label><input id="f-fbaudio" type="file" accept="audio/*">
        ${t.feedbackAudio?`<audio controls src="${t.feedbackAudio}" style="width:100%;margin-top:.5rem"></audio>`:''}</div>
      <div class="field"><label for="f-grade">Nota (0.0 – 5.0)</label><input id="f-grade" type="number" step="0.1" min="0" max="5" value="${t.grade!=null?t.grade:'3.5'}"></div>

}
